# Config para prepare_finetune_data.py ao gerar dados do reranker v2.
# Usa embeddings do fine-tuned v2 para hard negative mining mais preciso.

data:
  derm_csv: "data/processed/derm_cases.csv"
  text_col: "patient"
  id_col: "patient_uid"
  similar_col: "similar_patients"

embedding:
  model_name: "models/bge-m3-derm-v2"
  max_length: 1024
  cache_path: "data/processed/embeddings_bge_m3_finetuned_v2.npy"

finetune:
  data_dir:            "data/finetune_reranker_v2"
  output_dir:          "models/reranker-derm-v2"
  n_test:              1000
  n_val:                700
  val_seed:              43
  n_hard_negatives:       7
  positive_min_score:     1    # todos os similares (score>=1) são positivos
