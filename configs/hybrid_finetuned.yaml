# Hybrid com BGE-M3 fine-tunado + BM25 + RRF.

data:
  derm_csv: "data/processed/derm_cases.csv"
  text_col: "patient"
  id_col: "patient_uid"
  similar_col: "similar_patients"

split:
  min_similars: 1
  n_queries: 1000
  seed: 42

embedding:
  model_name: "models/bge-m3-derm"
  device: "cuda"
  batch_size: 32
  max_length: 1024
  normalize: true
  cache_path: "data/processed/embeddings_bge_m3_finetuned.npy"

retrieval:
  candidates: 100
  rrf_k: 60
  use_reranker: false
  top_k: 50

evaluation:
  k_values: [1, 5, 10]
  also_strict: true
  results_dir: "results"
  run_name: "hybrid_bge_m3_finetuned"
