# Hybrid Dense+BM25+RRF sem reranker — run_name distinto para não conflitar
# com hybrid_bge_m3_* (que inclui versões com reranker).

data:
  derm_csv: "data/processed/derm_cases.csv"
  text_col: "patient"
  id_col: "patient_uid"
  similar_col: "similar_patients"

split:
  min_similars: 1
  n_queries: 1000
  seed: 42

embedding:
  model_name: "BAAI/bge-m3"
  device: "cuda"
  batch_size: 32
  max_length: 1024
  normalize: true
  cache_path: "data/processed/embeddings_bge_m3.npy"

retrieval:
  candidates: 100
  rrf_k: 60
  use_reranker: false
  top_k: 50

evaluation:
  k_values: [1, 5, 10]
  also_strict: true
  results_dir: "results"
  run_name: "hybrid_bge_m3_norr"    # "norr" = no reranker, prefixo único
